<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>桃園區農會｜文旦・中秋禮盒訂單查詢</title>

  <style>

    /* =====================================================
       基本設定
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #3b332b;

      background:
        linear-gradient(
          180deg,
          #fff9ed 0%,
          #fffdf8 45%,
          #f7f3e8 100%
        );

      min-height: 100vh;
    }


    button,
    input {
      font-family: inherit;
    }


    /* =====================================================
       網頁最外層
       ===================================================== */

    .app {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      padding:
        24px
        16px
        50px;
    }


    /* =====================================================
       LOGO／標題
       ===================================================== */

    .hero {
      text-align: center;

      padding:
        20px
        10px
        16px;
    }


    .hero-badge {
      display: inline-block;

      padding:
        6px
        14px;

      margin-bottom:
        10px;

      border-radius:
        999px;

      background:
        #6d873d;

      color:
        #ffffff;

      font-size:
        13px;

      font-weight:
        800;

      letter-spacing:
        1px;
    }


    .hero h1 {
      margin:
        0
        0
        8px;

      color:
        #6b3d1f;

      font-size:
        29px;

      font-weight:
        900;

      letter-spacing:
        1px;
    }


    .hero p {
      margin: 0;

      color: #836b54;

      font-size: 15px;

      font-weight: 700;
    }


    /* =====================================================
       查詢區
       ===================================================== */

    .search-card {
      width: 100%;

      margin:
        0 auto
        22px;

      padding:
        22px;

      border:
        1px solid #eadbc4;

      border-radius:
        18px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      box-shadow:
        0 8px 25px
        rgba(
          100,
          70,
          35,
          0.09
        );
    }


    .search-title {
      margin-bottom:
        12px;

      text-align:
        center;

      color:
        #5f3b21;

      font-size:
        19px;

      font-weight:
        900;
    }


    .search-help {
      margin:
        -4px
        0
        15px;

      text-align:
        center;

      color:
        #8a7560;

      font-size:
        13px;
    }


    .search-row {
      display: flex;

      gap: 9px;

      width: 100%;
    }


    #keyword {
      flex: 1;

      min-width: 0;

      height: 50px;

      padding:
        0
        15px;

      border:
        2px solid #d9c7ae;

      border-radius:
        12px;

      outline: none;

      background:
        #fff;

      color:
        #333;

      font-size:
        17px;

      font-weight:
        700;

      transition:
        0.2s;
    }


    #keyword:focus {
      border-color:
        #8a9e4e;

      box-shadow:
        0 0 0 3px
        rgba(
          138,
          158,
          78,
          0.12
        );
    }


    #searchBtn {
      min-width:
        112px;

      height:
        50px;

      padding:
        0
        18px;

      border:
        none;

      border-radius:
        12px;

      cursor:
        pointer;

      background:
        #6f863e;

      color:
        #fff;

      font-size:
        16px;

      font-weight:
        900;

      box-shadow:
        0 5px 12px
        rgba(
          86,
          108,
          45,
          0.18
        );
    }


    #searchBtn:hover {
      background:
        #607533;
    }


    #searchBtn:disabled {
      cursor:
        not-allowed;

      opacity:
        0.65;
    }


    /* =====================================================
       訊息
       ===================================================== */

    .message {
      display: none;

      margin:
        18px
        0;

      padding:
        15px;

      border-radius:
        12px;

      text-align:
        center;

      font-size:
        15px;

      font-weight:
        800;
    }


    .message.show {
      display: block;
    }


    .message.info {
      color:
        #68582f;

      background:
        #fff7d9;

      border:
        1px solid #ecd788;
    }


    .message.error {
      color:
        #8d3030;

      background:
        #fff0f0;

      border:
        1px solid #edbbbb;
    }


    /* =====================================================
       查詢結果標題工具列
       ===================================================== */

    .result-toolbar {
      display: none;

      align-items: center;

      justify-content:
        space-between;

      gap:
        12px;

      margin:
        14px
        0;
    }


    .result-toolbar.show {
      display: flex;
    }


    .result-summary {
      color:
        #584736;

      font-size:
        16px;

      font-weight:
        900;
    }


    .toolbar-actions {
      display: flex;

      align-items:
        center;

      gap:
        8px;
    }


    .toolbar-btn {
      border:
        none;

      border-radius:
        10px;

      padding:
        10px
        15px;

      cursor:
        pointer;

      font-size:
        14px;

      font-weight:
        900;
    }


    .toolbar-btn.print {
      background:
        #4f7234;

      color:
        #fff;
    }


    .toolbar-btn.again {
      background:
        #efe7da;

      color:
        #62462e;
    }


    /* =====================================================
       網頁版訂單
       ===================================================== */

    #screenOrders {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap:
        15px;
    }


    .order-card {
      position:
        relative;

      width:
        100%;

      padding:
        18px;

      border:
        1px solid #d8d0c7;

      border-radius:
        16px;

      background:
        #fff;

      box-shadow:
        0 5px 18px
        rgba(
          65,
          48,
          31,
          0.07
        );

      overflow:
        hidden;
    }


    .order-card::before {
      content: "";

      position:
        absolute;

      left:
        0;

      top:
        0;

      bottom:
        0;

      width:
        5px;

      background:
        var(
          --order-color,
          #6f863e
        );
    }


    .order-title {
      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      margin:
        0
        0
        12px;

      padding-bottom:
        10px;

      border-bottom:
        1px solid #e2ddd7;

      color:
        #3e352c;

      font-size:
        18px;

      line-height:
        1.1;

      font-weight:
        900;
    }


    .order-type-dot {
      flex:
        0 0 auto;

      width:
        13px;

      height:
        13px;

      border:
        2px solid #333;

      border-radius:
        50%;

      background:
        var(
          --order-color,
          #777
        );
    }


    .info-row {
      margin-bottom:
        8px;

      padding-bottom:
        7px;

      border-bottom:
        1px solid #f0ece8;
    }


    .info-label {
      display:
        block;

      margin-bottom:
        2px;

      color:
        #8b7d70;

      font-size:
        11px;

      font-weight:
        700;
    }


    .info-value {
      display:
        block;

      color:
        #2e2924;

      font-size:
        15px;

      line-height:
        1.25;

      font-weight:
        800;

      word-break:
        break-word;
    }


    .customer-value {
      font-size:
        17px;

      font-weight:
        900;
    }


    .product-section {
      margin-top:
        11px;
    }


    .product-title {
      margin-bottom:
        7px;

      color:
        #726455;

      font-size:
        12px;

      font-weight:
        900;
    }


    .product-row {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:
        10px;

      padding:
        4px
        0;

      color:
        #27221e;

      font-size:
        14px;

      line-height:
        1.35;
    }


    .product-left {
      flex:
        1;

      min-width:
        0;

      font-weight:
        800;

      word-break:
        break-word;
    }


    .product-right {
      flex:
        0
        0 auto;

      white-space:
        nowrap;

      color:
        #504335;

      font-size:
        13px;

      font-weight:
        900;
    }


    .total-row {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      margin-top:
        12px;

      padding-top:
        10px;

      border-top:
        1px dashed #bbb1a8;
    }


    .total-label {
      color:
        #574a3d;

      font-size:
        13px;

      font-weight:
        900;
    }


    .total-amount {
      color:
        #38502b;

      font-size:
        21px;

      line-height:
        1;

      font-weight:
        900;

      white-space:
        nowrap;
    }


    /* =====================================================
       列印區
       平常完全隱藏
       ===================================================== */

    #printArea {
      display:
        none;
    }


    /* =====================================================
       手機版
       ===================================================== */

    @media
      (
        max-width:
        650px
      ) {

      .app {
        padding:
          12px
          10px
          35px;
      }


      .hero {
        padding-top:
          12px;
      }


      .hero h1 {
        font-size:
          24px;
      }


      .search-card {
        padding:
          16px;
      }


      .search-row {
        flex-direction:
          column;
      }


      #searchBtn {
        width:
          100%;
      }


      #screenOrders {
        grid-template-columns:
          1fr;
      }


      .result-toolbar {
        align-items:
          flex-start;

        flex-direction:
          column;
      }


      .toolbar-actions {
        width:
          100%;

        justify-content:
          flex-end;
      }

    }


    /* =====================================================
       A4 列印專用
       一頁 6 張
       2 欄 × 3 列
       大字清楚版
       ===================================================== */

    @media print {

      @page {
        size:
          A4
          portrait;

        margin:
          5mm;
      }


      html,
      body {
        width:
          210mm !important;

        margin:
          0 !important;

        padding:
          0 !important;

        background:
          #fff !important;

        -webkit-print-color-adjust:
          exact !important;

        print-color-adjust:
          exact !important;
      }


      body * {
        visibility:
          hidden !important;
      }


      #printArea,
      #printArea * {
        visibility:
          visible !important;
      }


      #printArea {
        display:
          block !important;

        position:
          absolute;

        left:
          0;

        top:
          0;

        width:
          100% !important;

        margin:
          0 !important;

        padding:
          0 !important;
      }


      .print-page {
        display:
          grid !important;

        grid-template-columns:
          repeat(
            2,
            1fr
          ) !important;

        grid-template-rows:
          repeat(
            3,
            91mm
          ) !important;

        column-gap:
          3mm !important;

        row-gap:
          3mm !important;

        width:
          200mm !important;

        min-height:
          279mm !important;

        margin:
          0 auto !important;

        padding:
          0 !important;

        break-after:
          page !important;

        page-break-after:
          always !important;
      }


      .print-page:last-child {
        break-after:
          auto !important;

        page-break-after:
          auto !important;
      }


      .print-card {
        position:
          relative !important;

        box-sizing:
          border-box !important;

        width:
          100% !important;

        height:
          91mm !important;

        margin:
          0 !important;

        padding:
          3.3mm
          3.7mm
          3mm
          3.7mm !important;

        border:
          1.2px solid #777 !important;

        border-radius:
          2.7mm !important;

        background:
          #fff !important;

        color:
          #000 !important;

        box-shadow:
          none !important;

        overflow:
          hidden !important;

        break-inside:
          avoid !important;

        page-break-inside:
          avoid !important;

        font-family:
          "Microsoft JhengHei",
          "Noto Sans TC",
          Arial,
          sans-serif !important;
      }


      .print-order-title {
        display:
          flex !important;

        align-items:
          center !important;

        gap:
          1.4mm !important;

        margin:
          0
          0
          1.8mm
          0 !important;

        padding:
          0
          0
          1.3mm
          0 !important;

        border-bottom:
          1px solid #aaa !important;

        color:
          #111 !important;

        font-size:
          15px !important;

        line-height:
          1 !important;

        font-weight:
          900 !important;
      }


      .print-dot {
        width:
          3.5mm !important;

        height:
          3.5mm !important;

        flex:
          0 0
          3.5mm !important;

        border:
          1px solid #333 !important;

        border-radius:
          50% !important;

        background:
          #777 !important;
      }


      .print-info-row {
        margin:
          0
          0
          1.15mm
          0 !important;

        padding:
          0
          0
          0.9mm
          0 !important;

        border-bottom:
          1px solid #e3e3e3 !important;
      }


      .print-label {
        display:
          block !important;

        margin:
          0
          0
          0.25mm
          0 !important;

        color:
          #444 !important;

        font-size:
          8.5px !important;

        line-height:
          1 !important;

        font-weight:
          700 !important;
      }


      .print-value {
        display:
          block !important;

        color:
          #000 !important;

        font-size:
          11.5px !important;

        line-height:
          1.05 !important;

        font-weight:
          800 !important;

        word-break:
          break-word !important;
      }


      .print-customer {
        font-size:
          13px !important;

        font-weight:
          900 !important;
      }


      .print-product-title {
        margin:
          1.5mm
          0
          0.8mm
          0 !important;

        color:
          #333 !important;

        font-size:
          9px !important;

        line-height:
          1 !important;

        font-weight:
          900 !important;
      }


      .print-product-row {
        display:
          flex !important;

        justify-content:
          space-between !important;

        align-items:
          flex-start !important;

        gap:
          2mm !important;

        margin:
          0
          0
          1.1mm
          0 !important;

        padding:
          0 !important;

        color:
          #000 !important;

        font-size:
          11px !important;

        line-height:
          1.15 !important;

        font-weight:
          800 !important;
      }


      .print-product-left {
        flex:
          1 !important;

        min-width:
          0 !important;

        word-break:
          break-word !important;
      }


      .print-product-right {
        flex:
          0
          0
          auto !important;

        white-space:
          nowrap !important;

        font-size:
          10.5px !important;

        font-weight:
          900 !important;
      }


      .print-total {
        display:
          flex !important;

        justify-content:
          space-between !important;

        align-items:
          center !important;

        gap:
          2mm !important;

        margin:
          1.7mm
          0
          0
          0 !important;

        padding:
          1.3mm
          0
          0
          0 !important;

        border-top:
          1px dashed #999 !important;
      }


      .print-total-label {
        color:
          #222 !important;

        font-size:
          9.5px !important;

        font-weight:
          900 !important;
      }


      .print-total-amount {
        color:
          #000 !important;

        white-space:
          nowrap !important;

        font-size:
          15px !important;

        line-height:
          1 !important;

        font-weight:
          900 !important;
      }

    }

  </style>
</head>


<body>

  <div
    class="app"
    id="app"
  >

    <!-- ===================================================
         標題
         =================================================== -->

    <section class="hero">

      <div class="hero-badge">
        桃園區農會
      </div>

      <h1>
        🔍 訂單查詢
      </h1>

      <p>
        文旦・中秋禮盒 一次查詢
      </p>

    </section>


    <!-- ===================================================
         搜尋
         =================================================== -->

    <section
      class="search-card"
      id="searchCard"
    >

      <div class="search-title">
        請輸入訂購人
      </div>

      <div class="search-help">
        可輸入姓名、部分姓名或查詢代碼，例如：羅小瑄、154
      </div>

      <div class="search-row">

        <input
          type="text"
          id="keyword"
          placeholder="例如：羅小瑄154"
          autocomplete="off"
        >

        <button
          type="button"
          id="searchBtn"
        >
          查詢訂單
        </button>

      </div>

    </section>


    <!-- ===================================================
         系統訊息
         =================================================== -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- ===================================================
         查詢結果工具列
         =================================================== -->

    <div
      id="resultToolbar"
      class="result-toolbar"
    >

      <div
        id="resultSummary"
        class="result-summary"
      ></div>


      <div class="toolbar-actions">

        <button
          type="button"
          class="toolbar-btn print"
          onclick="printOrders()"
        >
          🖨 列印
        </button>

        <button
          type="button"
          class="toolbar-btn again"
          onclick="searchAgain()"
        >
          查詢其他訂單
        </button>

      </div>

    </div>


    <!-- ===================================================
         電腦／手機顯示結果
         =================================================== -->

    <div id="screenOrders"></div>

  </div>


  <!-- =====================================================
       真正列印區
       JS 自動每 6 筆切一頁
       ===================================================== -->

  <div id="printArea"></div>


  <script>

    /*******************************************************
     * Apps Script API
     *
     * 如果之後重新部署 Apps Script，
     * 只要修改下面這一行網址。
     *******************************************************/

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyP6K-m9xIANKeSuUyAjjM2UZimDnFnow8XXbkInQeHvONYf7dC3vp8VJ8M3XbFRo4oTA/exec';


    /*******************************************************
     * 全域資料
     *******************************************************/

    let currentOrders = [];


    /*******************************************************
     * 網頁載入
     *******************************************************/

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        const keyword =
          document.getElementById(
            'keyword'
          );

        const searchBtn =
          document.getElementById(
            'searchBtn'
          );


        searchBtn.addEventListener(
          'click',
          searchOrders
        );


        keyword.addEventListener(
          'keydown',
          function (event) {

            if (
              event.key ===
              'Enter'
            ) {

              event.preventDefault();

              searchOrders();

            }

          }
        );


        setTimeout(
          function () {
            keyword.focus();
          },
          200
        );

      }
    );


    /*******************************************************
     * 搜尋訂單
     *******************************************************/

    function searchOrders() {

      const keywordInput =
        document.getElementById(
          'keyword'
        );

      const searchBtn =
        document.getElementById(
          'searchBtn'
        );

      const keyword =
        String(
          keywordInput.value ||
          ''
        ).trim();


      if (!keyword) {

        showMessage(
          '請輸入訂購人姓名或查詢代碼。',
          'error'
        );

        keywordInput.focus();

        return;

      }


      hideMessage();

      clearResults();


      searchBtn.disabled =
        true;

      searchBtn.textContent =
        '查詢中...';


      jsonpRequest(
        {
          action:
            'search',

          keyword:
            keyword
        },

        function (data) {

          searchBtn.disabled =
            false;

          searchBtn.textContent =
            '查詢訂單';


          if (
            !data ||
            data.success !== true
          ) {

            currentOrders =
              [];

            showMessage(
              (
                data &&
                data.message
              )
                ?
                data.message
                :
                '查無符合的訂單。',
              'error'
            );

            return;

          }


          const orders =
            Array.isArray(
              data.orders
            )
              ?
              data.orders
              :
              [];


          if (
            orders.length ===
            0
          ) {

            currentOrders =
              [];

            showMessage(
              '查無符合的訂單，請確認姓名或代碼是否正確。',
              'error'
            );

            return;

          }


          currentOrders =
            orders;


          renderOrders(
            currentOrders
          );


          document
            .getElementById(
              'resultToolbar'
            )
            .classList
            .add(
              'show'
            );


          document.getElementById(
            'resultSummary'
          ).textContent =
            '共找到 ' +
            currentOrders.length +
            ' 筆訂單';


          /*
           * 查詢成功後，
           * 捲到結果最上面
           */

          setTimeout(
            function () {

              document
                .getElementById(
                  'resultToolbar'
                )
                .scrollIntoView(
                  {
                    behavior:
                      'smooth',

                    block:
                      'start'
                  }
                );

            },
            100
          );

        },

        function () {

          searchBtn.disabled =
            false;

          searchBtn.textContent =
            '查詢訂單';


          showMessage(
            '目前無法連線到訂單系統，請稍後再試。',
            'error'
          );

        }
      );

    }


    /*******************************************************
     * JSONP 呼叫 Apps Script
     *******************************************************/

    function jsonpRequest(
      params,
      successCallback,
      errorCallback
    ) {

      const callbackName =
        '__orderCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function () {

            if (finished) {
              return;
            }

            finished =
              true;


            cleanup();


            if (
              typeof
              errorCallback ===
              'function'
            ) {

              errorCallback(
                new Error(
                  '連線逾時'
                )
              );

            }

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] =
            undefined;

        }


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function (data) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (
            typeof
            successCallback ===
            'function'
          ) {

            successCallback(
              data
            );

          }

        };


      const query =
        new URLSearchParams();


      Object.keys(
        params
      ).forEach(
        function (key) {

          query.append(
            key,
            params[key]
          );

        }
      );


      query.append(
        'callback',
        callbackName
      );


      query.append(
        '_',
        Date.now()
      );


      script.src =
        API_URL +
        '?' +
        query.toString();


      script.onerror =
        function () {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          if (
            typeof
            errorCallback ===
            'function'
          ) {

            errorCallback(
              new Error(
                'API 載入失敗'
              )
            );

          }

        };


      document.head
        .appendChild(
          script
        );

    }


    /*******************************************************
     * 顯示訂單
     *******************************************************/

    function renderOrders(
      orders
    ) {

      const screen =
        document.getElementById(
          'screenOrders'
        );


      screen.innerHTML =
        '';


      orders.forEach(
        function (
          order,
          index
        ) {

          screen.insertAdjacentHTML(
            'beforeend',
            createScreenCard(
              order,
              index
            )
          );

        }
      );


      /*
       * 同時建立列印版
       */

      buildPrintPages(
        orders
      );

    }


    /*******************************************************
     * 網頁版卡片
     *******************************************************/

    function createScreenCard(
      order,
      index
    ) {

      const color =
        order.color ||
        (
          order.type ===
          'pomelo'
            ?
            '#4f7d37'
            :
            '#a95b29'
        );


      const title =
        order.type ===
        'pomelo'
          ?
          '🍐 文旦訂單'
          :
          '🥮 中秋月餅訂單';


      let html =
        '<article ' +
        'class="order-card" ' +
        'style="--order-color:' +
        escapeHtml(color) +
        ';">';


      html +=
        '<div class="order-title">' +
          '<span class="order-type-dot"></span>' +
          '<span>' +
            title +
          '</span>' +
        '</div>';


      if (
        hasText(
          order.timestamp
        )
      ) {

        html +=
          infoRow(
            '訂購時間',
            order.timestamp
          );

      }


      if (
        hasText(
          order.customerName
        )
      ) {

        html +=
          infoRow(
            '訂購人',
            order.customerName,
            true
          );

      }


      if (
        hasText(
          order.pickupDate
        )
      ) {

        html +=
          infoRow(
            '取貨日期',
            order.pickupDate
          );

      }


      /*
       * Code.gs 已設定：
       * 中秋月餅 pickupLocation 為空白。
       * 所以只有文旦會進來。
       */

      if (
        hasText(
          order.pickupLocation
        )
      ) {

        html +=
          infoRow(
            '提貨地點',
            order.pickupLocation
          );

      }


      if (
        hasText(
          order.note
        )
      ) {

        html +=
          infoRow(
            '備註',
            order.note
          );

      }


      html +=
        createProductsHtml(
          order,
          false
        );


      html +=
        '<div class="total-row">' +

          '<span class="total-label">' +
            '訂單金額' +
          '</span>' +

          '<span class="total-amount">' +
            formatMoney(
              order.amount
            ) +
          '</span>' +

        '</div>';


      html +=
        '</article>';


      return html;

    }


    /*******************************************************
     * 基本資料列
     *******************************************************/

    function infoRow(
      label,
      value,
      customer
    ) {

      return (
        '<div class="info-row">' +

          '<span class="info-label">' +
            escapeHtml(
              label
            ) +
          '</span>' +

          '<span class="info-value' +
            (
              customer
                ?
                ' customer-value'
                :
                ''
            ) +
          '">' +

            escapeHtml(
              value
            ) +

          '</span>' +

        '</div>'
      );

    }


    /*******************************************************
     * 商品區
     *******************************************************/

    function createProductsHtml(
      order,
      forPrint
    ) {

      const products =
        Array.isArray(
          order.products
        )
          ?
          order.products
          :
          [];


      const prefix =
        forPrint
          ?
          'print-'
          :
          '';


      if (
        products.length ===
        0
      ) {

        return '';

      }


      let html =
        '<div class="' +
        prefix +
        'product-section">' +

          '<div class="' +
          prefix +
          'product-title">' +
            '訂購商品' +
          '</div>';


      products.forEach(
        function (
          product
        ) {

          const name =
            escapeHtml(
              product.name ||
              '商品'
            );


          const qty =
            numberText(
              product.quantity
            );


          const price =
            Number(
              product.price ||
              0
            );


          const subtotal =
            Number(
              product.subtotal ||
              0
            );


          let leftText =
            name +
            '：' +
            qty;


          let rightText =
            '';


          /*
           * 有單價時：
           *
           * 花蓮老欉文旦/6KG：50
           * NT$ 550 × 50 = NT$ 27,500
           */

          if (
            price >
            0
          ) {

            leftText =
              name +
              '：' +
              qty;


            rightText =
              formatMoney(
                price
              ) +
              ' × ' +
              qty +
              ' = ' +
              formatMoney(
                subtotal
              );

          }


          html +=
            '<div class="' +
            prefix +
            'product-row">' +

              '<div class="' +
              prefix +
              'product-left">' +

                leftText +

              '</div>';


          if (
            rightText
          ) {

            html +=
              '<div class="' +
              prefix +
              'product-right">' +

                rightText +

              '</div>';

          }


          html +=
            '</div>';

        }
      );


      html +=
        '</div>';


      return html;

    }


    /*******************************************************
     * 建立真正列印頁面
     *
     * 每 6 筆一個 print-page，
     * 所以不依賴瀏覽器自行判斷換頁。
     *******************************************************/

    function buildPrintPages(
      orders
    ) {

      const printArea =
        document.getElementById(
          'printArea'
        );


      printArea.innerHTML =
        '';


      const perPage =
        6;


      for (
        let start = 0;
        start < orders.length;
        start += perPage
      ) {

        const page =
          document.createElement(
            'section'
          );


        page.className =
          'print-page';


        const pageOrders =
          orders.slice(
            start,
            start +
            perPage
          );


        pageOrders.forEach(
          function (order) {

            page.insertAdjacentHTML(
              'beforeend',
              createPrintCard(
                order
              )
            );

          }
        );


        printArea.appendChild(
          page
        );

      }

    }


    /*******************************************************
     * 列印卡片
     *******************************************************/

    function createPrintCard(
      order
    ) {

      const title =
        order.type ===
        'pomelo'
          ?
          '文旦訂單'
          :
          '中秋月餅訂單';


      let html =
        '<article class="print-card">';


      html +=
        '<div class="print-order-title">' +

          '<span class="print-dot"></span>' +

          '<span>' +
            escapeHtml(
              title
            ) +
          '</span>' +

        '</div>';


      if (
        hasText(
          order.timestamp
        )
      ) {

        html +=
          printInfoRow(
            '訂購時間',
            order.timestamp
          );

      }


      if (
        hasText(
          order.customerName
        )
      ) {

        html +=
          printInfoRow(
            '訂購人',
            order.customerName,
            true
          );

      }


      if (
        hasText(
          order.pickupDate
        )
      ) {

        html +=
          printInfoRow(
            '取貨日期',
            order.pickupDate
          );

      }


      /*
       * 只有文旦才會顯示提貨地點
       */

      if (
        hasText(
          order.pickupLocation
        )
      ) {

        html +=
          printInfoRow(
            '提貨地點',
            order.pickupLocation
          );

      }


      if (
        hasText(
          order.note
        )
      ) {

        html +=
          printInfoRow(
            '備註',
            order.note
          );

      }


      html +=
        createProductsHtml(
          order,
          true
        );


      html +=
        '<div class="print-total">' +

          '<span class="print-total-label">' +
            '訂單金額' +
          '</span>' +

          '<span class="print-total-amount">' +
            formatMoney(
              order.amount
            ) +
          '</span>' +

        '</div>';


      html +=
        '</article>';


      return html;

    }


    /*******************************************************
     * 列印資料列
     *******************************************************/

    function printInfoRow(
      label,
      value,
      customer
    ) {

      return (
        '<div class="print-info-row">' +

          '<span class="print-label">' +
            escapeHtml(
              label
            ) +
          '</span>' +

          '<span class="print-value' +
            (
              customer
                ?
                ' print-customer'
                :
                ''
            ) +
          '">' +

            escapeHtml(
              value
            ) +

          '</span>' +

        '</div>'
      );

    }


    /*******************************************************
     * 列印
     *******************************************************/

    function printOrders() {

      if (
        !Array.isArray(
          currentOrders
        ) ||
        currentOrders.length ===
        0
      ) {

        showMessage(
          '目前沒有可以列印的訂單。',
          'error'
        );

        return;

      }


      /*
       * 列印前再建立一次，
       * 確保內容是最新的。
       */

      buildPrintPages(
        currentOrders
      );


      setTimeout(
        function () {

          window.print();

        },
        100
      );

    }


    /*******************************************************
     * 查詢其他訂單
     *******************************************************/

    function searchAgain() {

      currentOrders =
        [];


      clearResults();

      hideMessage();


      const keyword =
        document.getElementById(
          'keyword'
        );


      keyword.value =
        '';


      window.scrollTo(
        {
          top:
            0,

          behavior:
            'smooth'
        }
      );


      setTimeout(
        function () {

          keyword.focus();

        },
        300
      );

    }


    /*******************************************************
     * 清除結果
     *******************************************************/

    function clearResults() {

      document.getElementById(
        'screenOrders'
      ).innerHTML =
        '';


      document.getElementById(
        'printArea'
      ).innerHTML =
        '';


      document.getElementById(
        'resultSummary'
      ).textContent =
        '';


      document
        .getElementById(
          'resultToolbar'
        )
        .classList
        .remove(
          'show'
        );

    }


    /*******************************************************
     * 顯示訊息
     *******************************************************/

    function showMessage(
      text,
      type
    ) {

      const element =
        document.getElementById(
          'message'
        );


      element.textContent =
        text;


      element.className =
        'message show ' +
        (
          type ||
          'info'
        );

    }


    /*******************************************************
     * 隱藏訊息
     *******************************************************/

    function hideMessage() {

      const element =
        document.getElementById(
          'message'
        );


      element.textContent =
        '';


      element.className =
        'message';

    }


    /*******************************************************
     * 金額格式
     *******************************************************/

    function formatMoney(
      value
    ) {

      let number =
        Number(
          value ||
          0
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        number =
          0;

      }


      return (
        'NT$ ' +
        Math.round(
          number
        ).toLocaleString(
          'zh-TW'
        )
      );

    }


    /*******************************************************
     * 數量格式
     *******************************************************/

    function numberText(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        Number.isFinite(
          number
        )
      ) {

        if (
          Number.isInteger(
            number
          )
        ) {

          return String(
            number
          );

        }


        return String(
          number
        );

      }


      return escapeHtml(
        value
      );

    }


    /*******************************************************
     * 是否有資料
     *******************************************************/

    function hasText(
      value
    ) {

      if (
        value ===
        null ||
        value ===
        undefined
      ) {

        return false;

      }


      const text =
        String(
          value
        ).trim();


      return (
        text !==
        '' &&
        text !==
        '-' &&
        text !==
        '無'
      );

    }


    /*******************************************************
     * HTML 安全處理
     *******************************************************/

    function escapeHtml(
      value
    ) {

      return String(
        value ===
        null ||
        value ===
        undefined
          ?
          ''
          :
          value
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }

  </script>
