<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta
    name="theme-color"
    content="#4f7738"
  >

  <title>桃園區農會｜訂單查詢</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background: #f5f1e8;
      color: #30352d;
    }

    button,
    input {
      font-family: inherit;
    }


    /* ==============================
       主頁
    ============================== */

    .page {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 14px 12px 35px;
    }


    /* ==============================
       LOGO / 標題
    ============================== */

    .brand {
      text-align: center;
      padding: 15px 5px 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      color: #406a32;
      letter-spacing: 2px;
    }

    .brand-subtitle {
      margin-top: 7px;
      color: #8f785e;
      font-size: 14px;
      letter-spacing: 2px;
    }


    /* ==============================
       查詢卡
    ============================== */

    .search-card {
      background: #fff;
      border: 1px solid #e6e0d5;
      border-radius: 22px;
      padding: 23px 18px;
      box-shadow:
        0 6px 20px rgba(56,64,47,.07);
    }

    .search-title {
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      color: #404836;
    }

    .search-subtitle {
      text-align: center;
      margin-top: 5px;
      margin-bottom: 23px;
      color: #9a806b;
      font-size: 14px;
    }


    /* ==============================
       輸入欄
    ============================== */

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
      color: #525849;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    input {
      width: 100%;
      padding:
        15px
        14px
        15px
        46px;

      border: 1.5px solid #ded8cb;
      border-radius: 14px;
      background: #fdfcf9;

      font-size: 17px;
      color: #35382f;
      outline: none;
    }

    input:focus {
      border-color: #83a571;
      box-shadow:
        0 0 0 4px rgba(100,143,76,.10);
    }


    /* ==============================
       查詢按鈕
    ============================== */

    .search-btn {
      width: 100%;
      margin-top: 17px;
      padding: 16px;

      border: none;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #557d3e,
          #386127
        );

      color: white;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .search-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .tip {
      margin-top: 13px;
      text-align: center;
      color: #9f9587;
      font-size: 12px;
      line-height: 1.7;
    }


    /* ==============================
       Loading / 錯誤
    ============================== */

    .loading {
      display: none;
      margin-top: 18px;
      text-align: center;
      color: #648352;
      font-weight: 800;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px;

      border-radius: 12px;

      text-align: center;
      line-height: 1.6;
    }

    .message.error {
      display: block;

      color: #a5493e;
      border: 1px solid #efcac4;
      background: #fff2ef;
    }


    /* ==============================
       查詢結果
    ============================== */

    #result {
      display: none;
    }

    .result-head {
      padding: 9px 4px 12px;
    }

    .result-head-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .result-title {
      font-size: 21px;
      font-weight: 900;
      color: #3f6331;
    }

    .result-name {
      margin-top: 5px;
      color: #8f8578;
      font-size: 13px;
    }


    /* ==============================
       上方按鈕
    ============================== */

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 7px;
    }

    .print-btn,
    .again-top {
      border: 1px solid #d8cfbf;
      padding: 9px 12px;
      border-radius: 11px;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;
      white-space: nowrap;
    }

    .print-btn {
      color: #477035;
      border-color: #bdcdb4;
      background: #f8fbf5;
    }

    .again-top {
      color: #78533b;
      background: #fffdf9;
    }


    /* ==============================
       訂單卡
    ============================== */

    .order-card {
      background: #fff;
      border: 1px solid #e0ddd5;
      border-radius: 18px;

      margin-bottom: 16px;

      overflow: hidden;

      box-shadow:
        0 5px 16px rgba(61,68,53,.07);
    }

    .order-inner {
      padding: 18px;
    }

    .order-title {
      padding-bottom: 12px;
      border-bottom: 1px solid #dce7d7;

      font-size: 19px;
      font-weight: 900;

      color: var(--accent);
    }


    /* ==============================
       訂單基本資料
    ============================== */

    .detail {
      padding: 12px 0;
      border-bottom: 1px solid #eeeeea;
    }

    .detail-label {
      margin-bottom: 3px;
      font-size: 12px;
      color: #9b9b91;
    }

    .detail-value {
      color: #252820;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.5;
      word-break: break-word;
    }


    /* ==============================
       商品
    ============================== */

    .product-section-title {
      margin: 16px 0 9px;

      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
    }

    .product {
      padding: 13px;
      margin-bottom: 9px;

      border-radius: 12px;
      background: #f7f9f5;
    }

    .product-name {
      font-size: 15px;
      font-weight: 800;
      color: #30362e;
      line-height: 1.5;
    }

    .product-calc {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 8px;

      margin-top: 10px;
      padding-top: 10px;

      border-top: 1px dashed #d6ded1;

      font-size: 14px;
      color: #53594e;
    }

    .product-subtotal {
      color: var(--accent);
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .no-product {
      padding: 14px;

      border: 1px dashed #d9ddcf;
      border-radius: 12px;

      background: #fafbf8;

      color: #777c70;
      font-size: 14px;
      text-align: center;
    }


    /* ==============================
       訂單總金額
    ============================== */

    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 15px;
      padding: 14px;

      border: 1px dashed #bad0af;
      border-radius: 12px;

      background: #fbfdf9;
    }

    .order-total-label {
      font-size: 15px;
      font-weight: 900;
      color: #444b40;
    }

    .order-total-money {
      color: var(--accent);
      font-size: 23px;
      font-weight: 900;
    }


    /* ==============================
       Footer
    ============================== */

    .footer {
      text-align: center;
      padding: 22px 0 4px;

      color: #aaa094;
      font-size: 11px;
      line-height: 1.7;
    }


    /* ==============================
       手機
    ============================== */

    @media (max-width: 480px) {

      .page {
        padding: 10px 7px 28px;
      }

      .brand h1 {
        font-size: 25px;
      }

      .result-title {
        font-size: 18px;
      }

      .result-head-top {
        align-items: flex-start;
      }

      .top-actions {
        gap: 4px;
      }

      .print-btn,
      .again-top {
        padding: 8px;
        font-size: 11px;
      }

      .order-inner {
        padding: 15px;
      }

      .order-total-money {
        font-size: 21px;
      }
    }


    /* ==============================
       A4 列印
       一頁 6 張
       2欄 × 3列
    ============================== */

    @media print {

      @page {
        size: A4 portrait;
        margin: 6mm;
      }

      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }

      .brand,
      #searchBox,
      .result-head,
      .footer {
        display: none !important;
      }

      .page {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      #result {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      #orders {
        display: grid !important;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        grid-auto-rows: 92mm;

        column-gap: 3mm;
        row-gap: 2mm;

        width: 100% !important;
      }

      .order-card {
        height: 92mm !important;

        margin: 0 !important;
        padding: 0 !important;

        border:
          .35mm solid #999 !important;

        border-radius:
          3mm !important;

        box-shadow: none !important;
        overflow: hidden !important;

        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      .order-inner {
        padding:
          2.6mm
          3mm !important;
      }

      .order-title {
        padding-bottom:
          1.3mm !important;

        font-size:
          10.5pt !important;

        line-height:
          1.05 !important;
      }

      .detail {
        padding:
          .85mm
          0 !important;
      }

      .detail-label {
        margin-bottom:
          .15mm !important;

        font-size:
          6pt !important;

        line-height:
          1 !important;
      }

      .detail-value {
        font-size:
          8pt !important;

        line-height:
          1.05 !important;
      }

      .product-section-title {
        margin:
          1mm
          0
          .6mm !important;

        font-size:
          7.5pt !important;
      }

      .product {
        padding:
          1mm
          1.3mm !important;

        margin-bottom:
          .5mm !important;

        border-radius:
          1.3mm !important;
      }

      .product-name {
        font-size:
          7.1pt !important;

        line-height:
          1.05 !important;
      }

      .product-calc {
        margin-top:
          .45mm !important;

        padding-top:
          .45mm !important;

        font-size:
          6pt !important;

        line-height:
          1 !important;
      }

      .product-subtotal {
        font-size:
          7pt !important;
      }

      .order-total {
        margin-top:
          .8mm !important;

        padding:
          1mm
          1.4mm !important;
      }

      .order-total-label {
        font-size:
          7.3pt !important;
      }

      .order-total-money {
        font-size:
          10.5pt !important;

        line-height:
          1 !important;
      }


      /* ==============================
         文旦卡專用壓縮
      ============================== */

      .pomelo-card .order-inner {
        padding:
          1.9mm
          2.7mm !important;
      }

      .pomelo-card .order-title {
        padding-bottom:
          .8mm !important;

        font-size:
          9.5pt !important;
      }

      .pomelo-card .detail {
        padding:
          .42mm
          0 !important;
      }

      .pomelo-card .detail-label {
        font-size:
          5.3pt !important;

        margin-bottom:
          .05mm !important;
      }

      .pomelo-card .detail-value {
        font-size:
          7pt !important;

        line-height:
          1 !important;
      }

      .pomelo-card .product-section-title {
        margin:
          .55mm
          0
          .3mm !important;

        font-size:
          6.8pt !important;
      }

      .pomelo-card .product {
        padding:
          .55mm
          1mm !important;

        margin-bottom:
          .2mm !important;
      }

      .pomelo-card .product-name {
        font-size:
          6.3pt !important;

        line-height:
          1 !important;
      }

      .pomelo-card .product-calc {
        margin-top:
          .2mm !important;

        padding-top:
          .2mm !important;

        font-size:
          5.4pt !important;
      }

      .pomelo-card .product-subtotal {
        font-size:
          6.2pt !important;
      }

      .pomelo-card .order-total {
        margin-top:
          .25mm !important;

        padding:
          .65mm
          1.2mm !important;
      }

      .pomelo-card .order-total-label {
        font-size:
          6.5pt !important;
      }

      .pomelo-card .order-total-money {
        font-size:
          9.5pt !important;
      }


      /* 每 6 筆換頁 */

      .order-card:nth-child(6n+1) {
        break-before: page;
        page-break-before: always;
      }

      .order-card:first-child {
        break-before: auto;
        page-break-before: auto;
      }
    }

  </style>
</head>


<body>

<div class="page">


  <div class="brand">

    <h1>
      🌕 桃園區農會
    </h1>

    <div class="brand-subtitle">
      文旦・中秋禮盒 訂單查詢
    </div>

  </div>


  <!-- 查詢區 -->

  <div
    id="searchBox"
    class="search-card"
  >

    <div class="search-title">
      🔍 訂單查詢
    </div>

    <div class="search-subtitle">
      輸入姓名或查詢代碼即可
    </div>


    <div class="field">

      <label>
        訂購人／查詢代碼
      </label>

      <div class="input-wrap">

        <span class="input-icon">
          👤
        </span>

        <input
          id="name"
          type="text"
          placeholder="例如：羅曼瑄 或 154"
          autocomplete="off"
        >

      </div>

    </div>


    <button
      id="searchBtn"
      class="search-btn"
      onclick="searchOrder()"
    >
      🔍 查詢我的訂單
    </button>


    <div class="tip">
      例如訂購人為「羅曼瑄154」，
      輸入「羅曼瑄」或「154」都可以查詢。
    </div>


    <div
      id="loading"
      class="loading"
    >
      正在查詢訂單…
    </div>


    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- 查詢結果 -->

  <div id="result">

    <div class="result-head">

      <div class="result-head-top">

        <div class="result-title">
          📋 我的訂單
        </div>

        <div class="top-actions">

          <button
            class="print-btn"
            onclick="window.print()"
          >
            🖨️ 列印
          </button>

          <button
            class="again-top"
            onclick="resetSearch()"
          >
            查詢其他訂單 →
          </button>

        </div>

      </div>


      <div
        id="resultName"
        class="result-name"
      ></div>

    </div>


    <div id="orders"></div>

  </div>


  <div class="footer">
    桃園區農會
    <br>
    文旦・中秋禮盒訂單查詢系統
  </div>

</div>


<script>

/*************************************************
 * 正式 API
 *************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbyyuzHXB_Q2QqL2oZ3NSNsvgU-mX7-GDXSaLUo8FDOGkPkqIXmaL5J44M-G3Xrw8DHGSg/exec';


/*************************************************
 * Enter 搜尋
 *************************************************/

document.addEventListener(
  'DOMContentLoaded',
  function() {

    document
      .getElementById('name')
      .addEventListener(
        'keydown',
        function(event) {

          if (event.key === 'Enter') {
            searchOrder();
          }

        }
      );

  }
);


/*************************************************
 * 搜尋
 *************************************************/

function searchOrder() {

  const keyword =
    document
      .getElementById('name')
      .value
      .trim();

  hideMessage();

  if (!keyword) {

    showError(
      '請輸入訂購人姓名或查詢代碼。'
    );

    return;
  }

  setLoading(true);

  jsonpRequest(keyword);
}


/*************************************************
 * JSONP
 *************************************************/

function jsonpRequest(keyword) {

  const callbackName =
    '__orderCallback_' +
    Date.now();

  const script =
    document.createElement('script');

  let finished = false;


  const timer =
    setTimeout(
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        setLoading(false);

        showError(
          '查詢逾時，請稍後再試。'
        );

      },
      20000
    );


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timer);

      cleanup();

      setLoading(false);

      showResult(data);
    };


  function cleanup() {

    try {
      delete window[callbackName];
    } catch (error) {
      window[callbackName] =
        undefined;
    }

    if (script.parentNode) {
      script.parentNode
        .removeChild(script);
    }
  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timer);

      cleanup();

      setLoading(false);

      showError(
        '目前無法連線到訂單系統，請稍後再試。'
      );
    };


  script.src =
    API_URL +
    '?action=search' +
    '&keyword=' +
    encodeURIComponent(keyword) +
    '&callback=' +
    encodeURIComponent(callbackName) +
    '&t=' +
    Date.now();


  document.body.appendChild(script);
}


/*************************************************
 * 顯示結果
 *************************************************/

function showResult(data) {

  if (
    !data ||
    !data.success
  ) {

    showError(
      data && data.message
        ? data.message
        : '查無訂單資料。'
    );

    return;
  }


  if (
    !Array.isArray(data.orders)
  ) {

    showError(
      'API 已連線成功，但目前不是正式訂單查詢版本。'
    );

    return;
  }


  document
    .getElementById('searchBox')
    .style.display =
      'none';


  document
    .getElementById('result')
    .style.display =
      'block';


  document
    .getElementById('resultName')
    .textContent =
      '共找到 ' +
      data.orders.length +
      ' 筆訂單';


  const ordersBox =
    document.getElementById(
      'orders'
    );


  ordersBox.innerHTML = '';


  data.orders.forEach(
    function(order) {

      ordersBox.appendChild(
        createOrderCard(order)
      );

    }
  );


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}


/*************************************************
 * 訂單卡
 *************************************************/

function createOrderCard(order) {

  const card =
    document.createElement('div');


  card.className =
    'order-card ' +
    (
      order.type === 'pomelo'
        ? 'pomelo-card'
        : 'mooncake-card'
    );


  card.style.setProperty(
    '--accent',
    order.color || '#52783e'
  );


  const inner =
    document.createElement('div');

  inner.className =
    'order-inner';


  /* 標題 */

  const title =
    document.createElement('div');

  title.className =
    'order-title';

  title.textContent =
    (order.icon || '') +
    ' ' +
    (order.category || '') +
    '訂單';

  inner.appendChild(title);


  /* 訂購時間 */

  inner.appendChild(
    createDetail(
      '訂購時間',
      order.timestamp || '—'
    )
  );


  /* 訂購人 */

  inner.appendChild(
    createDetail(
      '訂購人',
      order.customerName || '—'
    )
  );


  /* 取貨日期 */

  inner.appendChild(
    createDetail(
      '取貨日期',
      order.pickupDate || '—'
    )
  );


  /* 只有文旦顯示提貨地點 */

  if (
    order.type === 'pomelo'
  ) {

    inner.appendChild(
      createDetail(
        '提貨地點',
        order.pickupLocation || '—'
      )
    );
  }


  /* 備註 */

  inner.appendChild(
    createDetail(
      '備註',
      order.note || '—'
    )
  );


  /* 商品標題 */

  const productTitle =
    document.createElement('div');

  productTitle.className =
    'product-section-title';

  productTitle.textContent =
    '訂購商品';

  inner.appendChild(
    productTitle
  );


  /* 商品 */

  if (
    order.products &&
    order.products.length > 0
  ) {

    order.products.forEach(
      function(product) {

        inner.appendChild(
          createProduct(product)
        );

      }
    );

  } else {

    const empty =
      document.createElement('div');

    empty.className =
      'no-product';

    empty.textContent =
      '未辨識到商品內容';

    inner.appendChild(empty);
  }


  /* 訂單金額 */

  const totalBox =
    document.createElement('div');

  totalBox.className =
    'order-total';


  const totalLabel =
    document.createElement('div');

  totalLabel.className =
    'order-total-label';

  totalLabel.textContent =
    '訂單金額';


  const totalMoney =
    document.createElement('div');

  totalMoney.className =
    'order-total-money';

  totalMoney.textContent =
    formatMoney(
      order.amount
    );


  totalBox.appendChild(
    totalLabel
  );

  totalBox.appendChild(
    totalMoney
  );

  inner.appendChild(
    totalBox
  );


  card.appendChild(inner);

  return card;
}


/*************************************************
 * 資料欄
 *************************************************/

function createDetail(
  label,
  value
) {

  const box =
    document.createElement('div');

  box.className =
    'detail';


  const labelBox =
    document.createElement('div');

  labelBox.className =
    'detail-label';

  labelBox.textContent =
    label;


  const valueBox =
    document.createElement('div');

  valueBox.className =
    'detail-value';

  valueBox.textContent =
    value || '—';


  box.appendChild(
    labelBox
  );

  box.appendChild(
    valueBox
  );

  return box;
}


/*************************************************
 * 商品
 *************************************************/

function createProduct(product) {

  const box =
    document.createElement('div');

  box.className =
    'product';


  const name =
    document.createElement('div');

  name.className =
    'product-name';

  name.textContent =
    product.name +
    ' ：' +
    formatQty(
      product.quantity
    );

  box.appendChild(name);


  /* 有單價才顯示計算 */

  if (
    Number(product.price) > 0
  ) {

    const calc =
      document.createElement('div');

    calc.className =
      'product-calc';


    const formula =
      document.createElement('span');

    formula.textContent =
      formatMoney(
        product.price
      ) +
      ' × ' +
      formatQty(
        product.quantity
      ) +
      ' =';


    const subtotal =
      document.createElement('span');

    subtotal.className =
      'product-subtotal';

    subtotal.textContent =
      formatMoney(
        product.subtotal
      );


    calc.appendChild(
      formula
    );

    calc.appendChild(
      subtotal
    );

    box.appendChild(calc);
  }


  return box;
}


/*************************************************
 * 金額格式
 *************************************************/

function formatMoney(value) {

  const amount =
    Number(value) || 0;

  return (
    'NT$ ' +
    amount.toLocaleString(
      'zh-TW',
      {
        maximumFractionDigits: 0
      }
    )
  );
}


/*************************************************
 * 數量
 *************************************************/

function formatQty(value) {

  const number =
    Number(value);

  if (
    Number.isInteger(number)
  ) {
    return String(number);
  }

  return String(number);
}


/*************************************************
 * Loading
 *************************************************/

function setLoading(loading) {

  document
    .getElementById('loading')
    .style.display =
      loading
        ? 'block'
        : 'none';


  const button =
    document.getElementById(
      'searchBtn'
    );


  button.disabled =
    loading;


  button.textContent =
    loading
      ? '查詢中…'
      : '🔍 查詢我的訂單';
}


/*************************************************
 * 錯誤
 *************************************************/

function showError(message) {

  const box =
    document.getElementById(
      'message'
    );

  box.className =
    'message error';

  box.textContent =
    message;

  box.style.display =
    'block';
}


function hideMessage() {

  const box =
    document.getElementById(
      'message'
    );

  box.style.display =
    'none';

  box.textContent =
    '';
}


/*************************************************
 * 查詢其他訂單
 *************************************************/

function resetSearch() {

  document
    .getElementById('result')
    .style.display =
      'none';


  document
    .getElementById('searchBox')
    .style.display =
      'block';


  document
    .getElementById('name')
    .value =
      '';


  document
    .getElementById('orders')
    .innerHTML =
      '';


  hideMessage();


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });


  setTimeout(
    function() {

      document
        .getElementById('name')
        .focus();

    },
    200
  );
}

</script>
