<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>桃園區農會｜文旦・中秋禮盒訂單查詢</title>

<style>

/* =========================================================
   全域
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 0;

  font-family:
    "Microsoft JhengHei",
    "Noto Sans TC",
    Arial,
    sans-serif;

  color: #3d332a;

  background:
    linear-gradient(
      180deg,
      #fff8e9 0%,
      #fffdf8 48%,
      #f7f1e5 100%
    );

  min-height: 100vh;
}

button,
input {
  font-family: inherit;
}


/* =========================================================
   主畫面
   ========================================================= */

.app {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  padding:
    22px
    16px
    50px;
}


/* =========================================================
   標題
   ========================================================= */

.hero {
  text-align: center;

  padding:
    18px
    10px
    16px;
}

.hero-badge {
  display: inline-block;

  margin-bottom: 10px;

  padding:
    6px
    15px;

  border-radius: 999px;

  background: #71863d;

  color: white;

  font-size: 13px;

  font-weight: 900;

  letter-spacing: 1px;
}

.hero h1 {
  margin:
    0
    0
    7px;

  color: #693c20;

  font-size: 30px;

  font-weight: 900;
}

.hero p {
  margin: 0;

  color: #806b57;

  font-size: 15px;

  font-weight: 700;
}


/* =========================================================
   查詢框
   ========================================================= */

.search-card {
  width: 100%;

  margin:
    0
    auto
    22px;

  padding: 22px;

  border:
    1px solid
    #e8d8c1;

  border-radius: 18px;

  background:
    rgba(
      255,
      255,
      255,
      0.97
    );

  box-shadow:
    0 8px 24px
    rgba(
      100,
      70,
      35,
      0.09
    );
}

.search-title {
  margin-bottom: 7px;

  text-align: center;

  color: #5d3a22;

  font-size: 20px;

  font-weight: 900;
}

.search-help {
  margin-bottom: 15px;

  text-align: center;

  color: #8b7763;

  font-size: 13px;
}

.search-row {
  display: flex;

  gap: 9px;
}

#keyword {
  flex: 1;

  min-width: 0;

  height: 52px;

  padding:
    0
    16px;

  border:
    2px solid
    #dac7ac;

  border-radius: 12px;

  outline: none;

  background: white;

  color: #333;

  font-size: 17px;

  font-weight: 800;
}

#keyword:focus {
  border-color: #879d4b;

  box-shadow:
    0 0 0 3px
    rgba(
      135,
      157,
      75,
      0.13
    );
}

#searchBtn {
  min-width: 115px;

  height: 52px;

  padding:
    0
    18px;

  border: none;

  border-radius: 12px;

  cursor: pointer;

  background: #6d843c;

  color: white;

  font-size: 16px;

  font-weight: 900;
}

#searchBtn:hover {
  background: #5e7333;
}

#searchBtn:disabled {
  opacity: 0.6;

  cursor: not-allowed;
}


/* =========================================================
   訊息
   ========================================================= */

.message {
  display: none;

  margin:
    15px
    0;

  padding: 15px;

  border-radius: 12px;

  text-align: center;

  font-size: 15px;

  font-weight: 800;
}

.message.show {
  display: block;
}

.message.info {
  color: #66552e;

  background: #fff7d9;

  border:
    1px solid
    #ead486;
}

.message.error {
  color: #8b3030;

  background: #fff0f0;

  border:
    1px solid
    #edbbbb;
}


/* =========================================================
   結果工具列
   ========================================================= */

.result-toolbar {
  display: none;

  align-items: center;

  justify-content:
    space-between;

  gap: 12px;

  margin:
    14px
    0;
}

.result-toolbar.show {
  display: flex;
}

.result-summary {
  color: #574737;

  font-size: 16px;

  font-weight: 900;
}

.toolbar-actions {
  display: flex;

  align-items: center;

  gap: 8px;
}

.toolbar-btn {
  border: none;

  border-radius: 10px;

  padding:
    10px
    15px;

  cursor: pointer;

  font-size: 14px;

  font-weight: 900;
}

.toolbar-btn.print {
  background: #4e7034;

  color: white;
}

.toolbar-btn.again {
  background: #eee5d8;

  color: #62462e;
}


/* =========================================================
   網頁訂單排列
   ========================================================= */

#screenOrders {
  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );

  gap: 15px;
}


/* =========================================================
   訂單卡片
   ========================================================= */

.order-card {
  position: relative;

  width: 100%;

  padding: 18px;

  border:
    1px solid
    #d8d0c7;

  border-radius: 16px;

  background: white;

  box-shadow:
    0 5px 18px
    rgba(
      65,
      48,
      31,
      0.07
    );

  overflow: hidden;
}

.order-card::before {
  content: "";

  position: absolute;

  top: 0;

  bottom: 0;

  left: 0;

  width: 5px;

  background:
    var(
      --order-color,
      #6f863e
    );
}

.order-title {
  display: flex;

  align-items: center;

  gap: 7px;

  margin:
    0
    0
    12px;

  padding-bottom: 10px;

  border-bottom:
    1px solid
    #e2ddd7;

  color: #3e352c;

  font-size: 18px;

  line-height: 1.1;

  font-weight: 900;
}

.order-type-dot {
  flex:
    0 0 auto;

  width: 13px;

  height: 13px;

  border:
    2px solid
    #333;

  border-radius: 50%;

  background:
    var(
      --order-color,
      #777
    );
}


/* =========================================================
   基本資料
   ========================================================= */

.info-row {
  margin-bottom: 8px;

  padding-bottom: 7px;

  border-bottom:
    1px solid
    #f0ece8;
}

.info-label {
  display: block;

  margin-bottom: 2px;

  color: #8b7d70;

  font-size: 11px;

  font-weight: 700;
}

.info-value {
  display: block;

  color: #2e2924;

  font-size: 15px;

  line-height: 1.25;

  font-weight: 800;

  word-break: break-word;
}

.customer-value {
  font-size: 18px;

  font-weight: 900;
}


/* =========================================================
   商品
   ========================================================= */

.product-section {
  margin-top: 11px;
}

.product-title {
  margin-bottom: 7px;

  color: #726455;

  font-size: 12px;

  font-weight: 900;
}

.product-row {
  margin-bottom: 8px;

  color: #27221e;

  font-size: 14px;

  line-height: 1.35;
}

.product-main {
  font-weight: 900;

  word-break: break-word;
}

.product-calculation {
  margin-top: 2px;

  color: #4e4338;

  font-size: 13px;

  font-weight: 800;
}


/* =========================================================
   訂單金額
   ========================================================= */

.total-row {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 10px;

  margin-top: 12px;

  padding-top: 10px;

  border-top:
    1px dashed
    #bbb1a8;
}

.total-label {
  color: #574a3d;

  font-size: 13px;

  font-weight: 900;
}

.total-amount {
  color: #38502b;

  font-size: 22px;

  line-height: 1;

  font-weight: 900;

  white-space: nowrap;
}


/* =========================================================
   列印區平常隱藏
   ========================================================= */

#printArea {
  display: none;
}


/* =========================================================
   手機
   ========================================================= */

@media (max-width: 650px) {

  .app {
    padding:
      12px
      10px
      35px;
  }

  .hero h1 {
    font-size: 25px;
  }

  .search-card {
    padding: 16px;
  }

  .search-row {
    flex-direction: column;
  }

  #searchBtn {
    width: 100%;
  }

  #screenOrders {
    grid-template-columns: 1fr;
  }

  .result-toolbar {
    align-items:
      flex-start;

    flex-direction:
      column;
  }

  .toolbar-actions {
    width: 100%;

    justify-content:
      flex-end;
  }

}


/* =========================================================
   ★ A4 列印
   ★ 一頁 6 張
   ★ 2欄 × 3列
   ★ 大字美化版
   ========================================================= */

@media print {

  @page {
    size: A4 portrait;

    margin: 5mm;
  }

  html,
  body {
    width: 210mm !important;

    padding: 0 !important;

    print-color-adjust:
      exact !important;

      0 !important;

    padding:
      0 !important;

  /* =====================================================
     每一頁

  .print-page {

      ) !important;

  /* 訂購人最大 */

<body>

<div
  class="app"
  id="app"
>

  <!-- 標題 -->

  <section class="hero">

    <div class="hero-badge">
      桃園區農會
    </div>

    <h1>
      🔍 訂單查詢
    </h1>

    <p>
      文旦・中秋禮盒 一次查詢
    </p>

  </section>


  <!-- 查詢 -->

  <section class="search-card">

    <div class="search-title">
      請輸入訂購人
    </div>

    <div class="search-help">
      可輸入姓名、部分姓名或查詢代碼
    </div>

    <div class="search-row">

      <input
        type="text"
        id="keyword"
        placeholder="例如：羅小瑄154"
        autocomplete="off"
      >

      <button
        type="button"
        id="searchBtn"
      >
        查詢訂單
      </button>

    </div>

  </section>


  <!-- 訊息 -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- 工具列 -->

  <div
    id="resultToolbar"
    class="result-toolbar"
  >

    <div
      id="resultSummary"
      class="result-summary"
    ></div>


    <div class="toolbar-actions">

      <button
        type="button"
        class="toolbar-btn print"
        onclick="printOrders()"
      >
        🖨 列印
      </button>

      <button
        type="button"
        class="toolbar-btn again"
        onclick="searchAgain()"
      >
        查詢其他訂單
      </button>

    </div>

  </div>


  <!-- 畫面訂單 -->

  <div id="screenOrders"></div>

</div>


<!-- 真正列印區 -->

<div id="printArea"></div>


<script>

/* =========================================================
   ★ 最新 Apps Script API
   ========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbycfVxwVOPJ531qeYWKfn2loVj1_9-PA_ZyqLbU1Cz8MhzB1UCBXMbzRM6vxqohlIQh/exec';


/* =========================================================
   目前訂單
   ========================================================= */

let currentOrders = [];


/* =========================================================
   初始化
   ========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function () {

    const keyword =
      document.getElementById(
        'keyword'
      );

    const searchBtn =
      document.getElementById(
        'searchBtn'
      );


    searchBtn.addEventListener(
      'click',
      searchOrders
    );


    keyword.addEventListener(
      'keydown',
      function (event) {

        if (
          event.key ===
          'Enter'
        ) {

          event.preventDefault();

          searchOrders();

        }

      }
    );


    setTimeout(
      function () {

        keyword.focus();

      },
      200
    );

  }
);


/* =========================================================
   搜尋
   ========================================================= */

function searchOrders() {

  const keywordInput =
    document.getElementById(
      'keyword'
    );

  const searchBtn =
    document.getElementById(
      'searchBtn'
    );


  const keyword =
    String(
      keywordInput.value ||
      ''
    ).trim();


  if (!keyword) {

    showMessage(
      '請輸入訂購人姓名或查詢代碼。',
      'error'
    );

    keywordInput.focus();

    return;

  }


  hideMessage();

  clearResults();


  searchBtn.disabled =
    true;

  searchBtn.textContent =
    '查詢中...';


  jsonpRequest(

    {
      action:
        'search',

      keyword:
        keyword
    },


    function (data) {

      searchBtn.disabled =
        false;

      searchBtn.textContent =
        '查詢訂單';


      if (!data) {

        showMessage(
          '訂單系統沒有回傳資料。',
          'error'
        );

        return;

      }


      if (
        data.success !==
        true
      ) {

        showMessage(
          data.message ||
          '查無符合的訂單。',
          'error'
        );

        return;

      }


      const orders =
        Array.isArray(
          data.orders
        )
          ?
          data.orders
          :
          [];


      if (
        orders.length ===
        0
      ) {

        showMessage(
          '查無符合的訂單，請確認姓名或代碼是否正確。',
          'error'
        );

        return;

      }


      currentOrders =
        orders;


      renderOrders(
        orders
      );


      document
        .getElementById(
          'resultToolbar'
        )
        .classList
        .add(
          'show'
        );


      document.getElementById(
        'resultSummary'
      ).textContent =
        '共找到 ' +
        orders.length +
        ' 筆訂單';


      setTimeout(
        function () {

          document
            .getElementById(
              'resultToolbar'
            )
            .scrollIntoView(
              {
                behavior:
                  'smooth',

                block:
                  'start'
              }
            );

        },
        100
      );

    },


    function (error) {

      console.error(
        error
      );


      searchBtn.disabled =
        false;

      searchBtn.textContent =
        '查詢訂單';


      showMessage(
        '目前無法連線到訂單系統，請稍後再試。',
        'error'
      );

    }

  );

}


/* =========================================================
   JSONP
   ========================================================= */

function jsonpRequest(
  params,
  successCallback,
  errorCallback
) {

  const callbackName =
    '__orderCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      1000000
    );


  const script =
    document.createElement(
      'script'
    );


  let completed =
    false;


  const timer =
    setTimeout(
      function () {

        if (
          completed
        ) {
          return;
        }


        completed =
          true;


        cleanup();


        if (
          typeof
          errorCallback ===
          'function'
        ) {

          errorCallback(
            new Error(
              'API 連線逾時'
            )
          );

        }

      },
      20000
    );


  function cleanup() {

    clearTimeout(
      timer
    );


    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] =
        undefined;

    }


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  window[
    callbackName
  ] =
    function (data) {

      if (
        completed
      ) {
        return;
      }


      completed =
        true;


      cleanup();


      if (
        typeof
        successCallback ===
        'function'
      ) {

        successCallback(
          data
        );

      }

    };


  const query =
    new URLSearchParams();


  Object.keys(
    params
  ).forEach(
    function (key) {

      query.append(
        key,
        params[key]
      );

    }
  );


  query.append(
    'callback',
    callbackName
  );


  query.append(
    '_',
    Date.now()
  );


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.async =
    true;


  script.onerror =
    function () {

      if (
        completed
      ) {
        return;
      }


      completed =
        true;


      cleanup();


      if (
        typeof
        errorCallback ===
        'function'
      ) {

        errorCallback(
          new Error(
            'API 載入失敗'
          )
        );

      }

    };


  document.head
    .appendChild(
      script
    );

}


/* =========================================================
   顯示所有訂單
   ========================================================= */

function renderOrders(
  orders
) {

  const screen =
    document.getElementById(
      'screenOrders'
    );


  screen.innerHTML =
    '';


  orders.forEach(
    function (
      order
    ) {

      screen.insertAdjacentHTML(
        'beforeend',
        createScreenCard(
          order
        )
      );

    }
  );


  buildPrintPages(
    orders
  );

}


/* =========================================================
   網頁訂單卡片
   ========================================================= */

function createScreenCard(
  order
) {

  const color =
    order.color ||
    (
      order.type ===
      'pomelo'
        ?
        '#4f7d37'
        :
        '#a95b29'
    );


  const title =
    order.type ===
    'pomelo'
      ?
      '🍐 文旦訂單'
      :
      '🥮 中秋月餅訂單';


  let html =
    '<article ' +
    'class="order-card" ' +
    'style="--order-color:' +
    escapeHtml(
      color
    ) +
    ';">';


  html +=
    '<div class="order-title">' +

      '<span class="order-type-dot"></span>' +

      '<span>' +
        title +
      '</span>' +

    '</div>';


  if (
    hasText(
      order.timestamp
    )
  ) {

    html +=
      screenInfoRow(
        '訂購時間',
        order.timestamp,
        false
      );

  }


  if (
    hasText(
      order.customerName
    )
  ) {

    html +=
      screenInfoRow(
        '訂購人',
        order.customerName,
        true
      );

  }


  if (
    hasText(
      order.pickupDate
    )
  ) {

    html +=
      screenInfoRow(
        '取貨日期',
        order.pickupDate,
        false
      );

  }


  /*
   * 月餅不顯示提貨地點
   */

  if (
    order.type ===
      'pomelo' &&
    hasText(
      order.pickupLocation
    )
  ) {

    html +=
      screenInfoRow(
        '提貨地點',
        order.pickupLocation,
        false
      );

  }


  if (
    hasText(
      order.note
    )
  ) {

    html +=
      screenInfoRow(
        '備註',
        order.note,
        false
      );

  }


  html +=
    createScreenProducts(
      order
    );


  html +=
    '<div class="total-row">' +

      '<span class="total-label">' +
        '訂單金額' +
      '</span>' +

      '<span class="total-amount">' +
        formatMoney(
          order.amount
        ) +
      '</span>' +

    '</div>';


  html +=
    '</article>';


  return html;

}


/* =========================================================
   網頁資料列
   ========================================================= */

function screenInfoRow(
  label,
  value,
  customer
) {

  return (

    '<div class="info-row">' +

      '<span class="info-label">' +
        escapeHtml(
          label
        ) +
      '</span>' +

      '<span class="info-value' +
        (
          customer
            ?
            ' customer-value'
            :
            ''
        ) +
      '">' +

        escapeHtml(
          value
        ) +

      '</span>' +

    '</div>'

  );

}


/* =========================================================
   網頁商品
   ========================================================= */

function createScreenProducts(
  order
) {

  const products =
    Array.isArray(
      order.products
    )
      ?
      order.products
      :
      [];


  if (
    products.length ===
    0
  ) {

    return '';

  }


  let html =
    '<div class="product-section">' +

      '<div class="product-title">' +
        '訂購商品' +
      '</div>';


  products.forEach(
    function (product) {

      const name =
        escapeHtml(
          product.name ||
          '商品'
        );


      const qty =
        formatQuantity(
          product.quantity
        );


      const price =
        Number(
          product.price ||
          0
        );


      const subtotal =
        Number(
          product.subtotal ||
          0
        );


      html +=
        '<div class="product-row">';


      html +=
        '<div class="product-main">' +

          name +
          '：' +
          escapeHtml(
            qty
          ) +

        '</div>';


      if (
        price >
        0
      ) {

        html +=
          '<div class="product-calculation">' +

            formatMoney(
              price
            ) +

            ' × ' +

            escapeHtml(
              qty
            ) +

            ' = ' +

            '<strong>' +

              formatMoney(
                subtotal
              ) +

            '</strong>' +

          '</div>';

      }


      html +=
        '</div>';

    }
  );


  html +=
    '</div>';


  return html;

}


/* =========================================================
   ★ 建立列印頁
   ★ 每頁固定 6 筆
   ========================================================= */

function buildPrintPages(
  orders
) {

  const printArea =
    document.getElementById(
      'printArea'
    );


  printArea.innerHTML =
    '';


  const perPage =
    6;


  for (
    let start = 0;
    start < orders.length;
    start += perPage
  ) {

    const page =
      document.createElement(
        'section'
      );


    page.className =
      'print-page';


    const pageOrders =
      orders.slice(
        start,
        start +
        perPage
      );


    pageOrders.forEach(
      function (order) {

        page.insertAdjacentHTML(
          'beforeend',
          createPrintCard(
            order
          )
        );

      }
    );


    printArea.appendChild(
      page
    );

  }

}


/* =========================================================
   ★ 列印卡片
   ========================================================= */

function createPrintCard(
  order
) {

  const title =
    order.type ===
    'pomelo'
      ?

      :

    )
  ) {

      );

  ) {

  ) {

        formatMoney(
          order.amount
        ) +
      '</span>' +

    '</div>';

}


/* =========================================================
   列印資料列
   ========================================================= */

) {

    '<div class="print-info-row">' +

      '<span class="print-label">' +
        escapeHtml(

        ) +
      '</span>' +

      '<span class="print-value' +
        (
          customer
            ?
            ' print-customer'
            :
            ''
        ) +
      '">' +

        escapeHtml(
          value
        ) +

      '</span>' +

    '</div>'

  );

}


/* =========================================================
   ★ 列印商品
   ========================================================= */

function createPrintProducts(
  order
) {

  const products =
    Array.isArray(
      order.products
    )
      ?

      :
      [];


  if (
    products.length ===

  ) {

      '<div class="print-product-title">' +

  products.forEach(
    function (product) {

      const name =
        escapeHtml(

        );


      const qty =

        );


      const price =
        Number(
          product.price ||
          0
        );


      const subtotal =
        Number(
          product.subtotal ||
          0
        );


      html +=
        '<div class="print-product-row">';


      /*
       * 第一行：
       * 花蓮老欉文旦/6KG：50

          '：' +

          ) +

       * NT$ 550 × 50 = NT$ 27,500
       */

      if (

      ) {

            ) +

            ) +

            ' = ' +

            '<strong>' +

                subtotal
              ) +

/* =========================================================
   列印按鈕
   ========================================================= */

function printOrders() {

  if (
    !Array.isArray(
      currentOrders
    ) ||
    currentOrders.length ===
    0
  ) {

    showMessage(
      '目前沒有可以列印的訂單。',
      'error'
    );

    return;

  }


  /*
   * 列印前重新建立，
   * 防止舊資料。
   */

  buildPrintPages(
    currentOrders
  );


  setTimeout(
    function () {

      window.print();

    },
    150
  );

}


/* =========================================================
   查詢其他訂單
   ========================================================= */

function searchAgain() {

  currentOrders =
    [];


  clearResults();

  hideMessage();


  const keyword =
    document.getElementById(
      'keyword'
    );


  keyword.value =
    '';


  window.scrollTo(
    {
      top: 0,

      behavior:
        'smooth'
    }
  );


  setTimeout(
    function () {

      keyword.focus();

    },
    300
  );

}


/* =========================================================
   清除結果
   ========================================================= */

function clearResults() {

  document.getElementById(
    'screenOrders'
  ).innerHTML =
    '';


  document.getElementById(
    'printArea'
  ).innerHTML =
    '';


  document.getElementById(
    'resultSummary'
  ).textContent =
    '';


  document
    .getElementById(
      'resultToolbar'
    )
    .classList
    .remove(
      'show'
    );

}


/* =========================================================
   顯示訊息
   ========================================================= */

function showMessage(
  text,
  type
) {

  const element =
    document.getElementById(
      'message'
    );


  element.textContent =
    text;


  element.className =
    'message show ' +
    (
      type ||
      'info'
    );

}


/* =========================================================
   隱藏訊息
   ========================================================= */

function hideMessage() {

  const element =
    document.getElementById(
      'message'
    );


  element.textContent =
    '';


  element.className =
    'message';

}


/* =========================================================
   金額格式
   ========================================================= */

function formatMoney(
  value
) {

  let number =
    Number(
      value ||
      0
    );


  if (
    !Number.isFinite(
      number
    )
  ) {

    number =
      0;

  }


  return (
    'NT$ ' +
    Math.round(
      number
    ).toLocaleString(
      'zh-TW'
    )
  );

}


/* =========================================================
   數量格式
   ========================================================= */

function formatQuantity(
  value
) {

  const number =
    Number(
      value
    );


  if (
    Number.isFinite(
      number
    )
  ) {

    if (
      Number.isInteger(
        number
      )
    ) {

      return String(
        number
      );

    }


    return String(
      number
    );

  }


  return String(
    value ||
    ''
  );

}


/* =========================================================
   是否有內容
   ========================================================= */

function hasText(
  value
) {

  if (
    value ===
    null ||
    value ===
    undefined
  ) {

    return false;

  }


  const text =
    String(
      value
    ).trim();


  return (
    text !==
    '' &&
    text !==
    '-' &&
    text !==
    '無'
  );

}


/* =========================================================
   HTML 安全
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ===
      null ||
    value ===
      undefined
      ?
      ''
      :
      value
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}
